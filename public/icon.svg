<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#0c101c"/>
  <rect x="32" y="32" width="448" height="448" rx="32" fill="#000080" stroke="#00ffff" stroke-width="12"/>
  <rect x="52" y="70" width="190" height="340" fill="#0000a8" stroke="#00ffff" stroke-width="4"/>
  <rect x="270" y="70" width="190" height="340" fill="#0000a8" stroke="#00ffff" stroke-width="4"/>
  <!-- Norton commander header -->
  <rect x="52" y="70" width="190" height="30" fill="#00aaaa"/>
  <rect x="270" y="70" width="190" height="30" fill="#00aaaa"/>
  <!-- Selection Bar -->
  <rect x="56" y="140" width="182" height="24" fill="#00ffff"/>
  <!-- Bottom Function Bar -->
  <rect x="52" y="420" width="408" height="36" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text x="70" y="444" fill="#ffff00" font-family="monospace" font-size="20" font-weight="bold">1</text>
  <text x="85" y="444" fill="#ffffff" font-family="monospace" font-size="16">Help</text>
  <text x="145" y="444" fill="#ffff00" font-family="monospace" font-size="20" font-weight="bold">3</text>
  <text x="160" y="444" fill="#ffffff" font-family="monospace" font-size="16">View</text>
  <text x="220" y="444" fill="#ffff00" font-family="monospace" font-size="20" font-weight="bold">5</text>
  <text x="235" y="444" fill="#ffffff" font-family="monospace" font-size="16">Copy</text>
  <text x="295" y="444" fill="#ffff00" font-family="monospace" font-size="20" font-weight="bold">7</text>
  <text x="310" y="444" fill="#ffffff" font-family="monospace" font-size="16">Mkdir</text>
  <text x="380" y="444" fill="#ffff00" font-family="monospace" font-size="20" font-weight="bold">10</text>
  <text x="405" y="444" fill="#ffffff" font-family="monospace" font-size="16">Quit</text>
  <text x="256" y="55" fill="#ffff00" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">OMNICOMMANDER PRO</text>
