name: Linux portability preflight

# Manual or Linux-port branch only: it builds and packages, which is too slow for
# every push. The real server's POSIX adapter is covered on master and in pull
# requests by `linux-integration.yml` instead.
on:
  workflow_dispatch:
  push:
    branches:
      - linux-port

permissions:
  contents: read

jobs:
  preflight:
    name: Static checks and build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation links
        run: npm run check:links

      - name: Lint
        run: npm run lint

      - name: Lint renderer
        run: npm run lint:eslint

      - name: Type check
        run: npm run typecheck:strict

      - name: Build renderer
        run: npm run build

      - name: Build Electron bundles
        run: npm run build:electron

      # These are test artifacts, not a release. The workflow does not run on
      # tags and electron-builder is told never to publish, so the packages are
      # only available from the run's artifacts. A Linux tester can still
      # download and install them to exercise the port.
      - name: Package the Linux AppImage and the .deb
        run: npx electron-builder --linux AppImage deb --publish never

      # The .deb is not just a renamed tarball: read its control fields and tie
      # them to package.json, so a package built from the wrong tree fails here
      # instead of on the machine of whoever installs it.
      - name: Check the AppImage and the .deb were produced
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::electron-builder produced no AppImage"
            exit 1
          fi
          if [ -z "$deb" ]; then
            echo "::error::electron-builder produced no .deb"
            exit 1
          fi
          # The same check the tag runs: one script, one spelling rule, and the
          # control fields it prints are the ones this job used to echo.
          node scripts/check-deb-version.cjs "$deb"
          file "$appimage" "$deb"
          ls -lh "$appimage" "$deb"

      - name: Upload the AppImage test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicommander-pro-linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload the .deb test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicommander-pro-linux-deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 7

      # The artifacts are already uploaded, so a build that breaks here still
      # reaches whoever has to look at it. What this proves is different from
      # the integration suite: that the packaged app starts on its own, serves
      # its own renderer and lists a mount, not just that the server module
      # answers when a test harness boots it.
      - name: Smoke the packaged AppImage under Xvfb
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            # The runner's apt gets the container's bounded waits: a mirror that
            # stops answering here would cost this job's whole timeout, and say
            # nothing about why.
            export APT_SUDO=sudo
            source scripts/ubuntu-apt.sh
            ubuntu_apt_update
            ubuntu_apt_install xvfb
          fi
          # The step summary is the only view of this verdict left once the log
          # is gone, and the script swallows its own write errors so a passing
          # app can still leave nobody able to read the rows it found. Failing
          # the step when the file stayed empty keeps "no summary" from looking
          # like success.
          status=0
          xvfb-run -a node scripts/linux-app-smoke.mjs "$appimage" || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux smoke (AppImage)' "$GITHUB_STEP_SUMMARY"; then
            echo "the verdict is in the run's step summary"
          else
            echo "::error::the smoke left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The smoke above proves the window boots and lists a mount. These four
      # cases ask whether the package can be used at all -- a folder opened, a
      # file copied between the panels, one file deleted for good and another
      # sent to the trash and restored -- because the listing never touches the
      # keyboard engine, the transfer queue or the server's delete.
      - name: Run the packaged AppImage's interaction cases under Xvfb
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            # The runner's apt gets the container's bounded waits: a mirror that
            # stops answering here would cost this job's whole timeout, and say
            # nothing about why.
            export APT_SUDO=sudo
            source scripts/ubuntu-apt.sh
            ubuntu_apt_update
            ubuntu_apt_install xvfb
          fi
          status=0
          xvfb-run -a node scripts/linux-app-e2e.mjs "$appimage" || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux AppImage e2e' "$GITHUB_STEP_SUMMARY"; then
            echo "the cases are in the run's step summary"
          else
            echo "::error::the interaction cases left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The four cases above are a hand-written floor: they prove the window can
      # be used, not that the app the suite describes is in the package. This runs
      # the suite's own specs against the AppImage -- the same files the dev run
      # uses, with the page fixture pointed at Electron's window (see
      # playwright.packaged.config.ts) -- and puts every case in the step summary.
      - name: Run the suite's specs against the packaged AppImage
        timeout-minutes: 40
        # The verdict matters even when an earlier case failed: a broken
        # interaction case and a broken suite are different findings, and one
        # should not hide the other.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::there is no AppImage for the suite to run against"
            exit 1
          fi
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            # The runner's apt gets the container's bounded waits: a mirror that
            # stops answering here would cost this job's whole timeout, and say
            # nothing about why.
            export APT_SUDO=sudo
            source scripts/ubuntu-apt.sh
            ubuntu_apt_update
            ubuntu_apt_install xvfb
          fi
          status=0
          # Unpacked once, not once per test: the runtime extracts a whole copy
          # of the app on every launch, and a test that ends with SIGKILL leaves
          # that copy behind. Ninety launches filled the runner's disk and every
          # case after that failed for a reason that had nothing to do with the
          # app.
          (cd release && "./$(basename "$appimage")" --appimage-extract >/dev/null)
          status=0
          OMNI_PACKAGED_APP="$PWD/release/squashfs-root/AppRun" xvfb-run -a npx playwright test \
            --config=playwright.packaged.config.ts || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Packaged app e2e' "$GITHUB_STEP_SUMMARY"; then
            echo "the cases are in the run's step summary"
          else
            echo "::error::the packaged specs left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # A .deb is a different package from the AppImage: the program lands under
      # /opt, its dependencies are declared, and a .desktop file points at it.
      # Building one proves neither that apt can install it nor that the copy it
      # leaves behind starts, which is exactly what a user does with the file
      # this run publishes.
      - name: Install the .deb and smoke the copy under /opt
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)
          package=$(dpkg-deb -f "$deb" Package)
          executable=$(node -p "require('./package.json').build.linux.executableName")

          # Bounded like the container's, with the same reasons: the mirror that
          # stalls here stalls there, and here the cost is the whole job.
          export APT_SUDO=sudo
          source scripts/ubuntu-apt.sh
          ubuntu_apt_update
          # By path, so apt installs the package this run built instead of a
          # release that happens to be published.
          ubuntu_apt_simulate "./$deb"
          ubuntu_apt_install "./$deb"

          # Where the package says it put the program, rather than a layout this
          # step assumes: a change there has to break here instead of hide.
          binary=$(dpkg -L "$package" | grep -E "^/opt/.*/${executable}$" | head -n 1 || true)
          if [ -z "$binary" ]; then
            files=$(dpkg -L "$package" | head -c 600 | tr '\n' ' ')
            echo "::error::the .deb installed no program at /opt/*/$executable; it installed: $files"
            exit 1
          fi
          echo "installed at $binary"

          if ! command -v xvfb-run >/dev/null 2>&1; then
            ubuntu_apt_install xvfb
          fi
          status=0
          xvfb-run -a node scripts/linux-app-smoke.mjs "$binary" 'installed .deb' || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux smoke (installed .deb)' "$GITHUB_STEP_SUMMARY"; then
            echo "the verdict is in the run's step summary"
          else
            echo "::error::the installed copy left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The Windows suite and e2e still assume Windows drives, shells and
      # shortcuts, so they are not run here. The real server's POSIX adapter is
      # covered on master and in pull requests by `linux-integration.yml`.

  # Every check above runs on an image that already carries what Electron links
  # against, so a `.deb` missing a dependency still installs and starts there.
  # This job repeats the install in a bare ubuntu image, where only the package's
  # own `Depends` can supply what the program needs.
  clean-ubuntu-install:
    name: Install the .deb on a clean Ubuntu 24.04
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the .deb this run built
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: omnicommander-pro-linux-deb
          path: pkg

      - name: Install and boot it inside ubuntu:24.04
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find pkg -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "::error::the run produced no .deb to install"
            exit 1
          fi
          status=0
          docker run --rm \
            -v "$PWD/$deb:/tmp/package.deb:ro" \
            -v "$PWD/scripts:/tmp/scripts:ro" \
            ubuntu:24.04 bash -euo pipefail /tmp/scripts/ubuntu-install-smoke.sh || status=$?
          if [ "$status" -eq 0 ]; then
            echo "### .deb on a clean Ubuntu 24.04: installed and booted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### .deb on a clean Ubuntu 24.04: failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # The file testers download is the release asset, not the `.deb` a later run
  # rebuilds from the same tree: same version, different bytes. The job above
  # can only speak for the package its own run produced, which is why a package
  # handed out as an asset could sit there installed by nobody. This job installs
  # the published asset itself -- checked against the digest GitHub records for
  # it, so it is the file the download URL serves -- in a bare ubuntu:24.04 and
  # boots the launcher the package installs. It does not wait for the build: what
  # it verifies already exists on the release page.
  released-deb-install:
    name: Install the published .deb on a clean Ubuntu 24.04
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the published .deb for this version
        id: download
        shell: bash
        # Read with the workflow's own token: an anonymous call shares the
        # runner's address with everything else on it and starts answering 403
        # once that hourly quota is gone, which is not the same as "no release".
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          node scripts/fetch-release-asset.mjs \
            "v$version" "OmniCommander-Pro-${version}-amd64.deb" pkg

      - name: Install and boot it inside ubuntu:24.04
        if: steps.download.outputs.skipped != 'yes'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find pkg -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "::error::the step above downloaded no .deb to install"
            exit 1
          fi
          status=0
          docker run --rm \
            -v "$PWD/$deb:/tmp/package.deb:ro" \
            -v "$PWD/scripts:/tmp/scripts:ro" \
            ubuntu:24.04 bash -euo pipefail /tmp/scripts/ubuntu-install-smoke.sh || status=$?
          {
            echo "### published .deb on a clean Ubuntu 24.04"
            echo
            echo "- asset: \`${{ steps.download.outputs.asset }}\` from \`${{ steps.download.outputs.tag }}\`"
            echo "- sha256: \`${{ steps.download.outputs.digest }}\`"
            echo "- size: ${{ steps.download.outputs.bytes }} bytes"
            if [ "$status" -eq 0 ]; then
              echo "- verdict: installed, and its launcher opened"
            else
              echo "- verdict: failed, see the container log above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The AppImage is the other published file, and a different kind of check: it
  # carries no dependency list, so the bare image has to be given the libraries
  # the `.deb` of the same version declares before a window can even be attempted.
  # Booting the asset answers what the run's own AppImage smoke cannot: that the
  # file on the release page opens, not a rebuild of it that shares its version.
  released-appimage-boot:
    name: Boot the published AppImage on a clean Ubuntu 24.04
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the published AppImage for this version
        id: download
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          node scripts/fetch-release-asset.mjs \
            "v$version" "OmniCommander-Pro-${version}-x86_64.AppImage" pkg

      - name: Boot it inside ubuntu:24.04
        if: steps.download.outputs.skipped != 'yes'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find pkg -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::the step above downloaded no AppImage to boot"
            exit 1
          fi
          # The AppImage declares nothing. What a desktop is expected to carry is
          # what the `.deb` of this version promises, so that list is the one the
          # container installs before trying to open the window.
          node -p "require('./package.json').build.deb.depends.join('\n')" > pkg/depends.txt
          status=0
          docker run --rm \
            -v "$PWD/$appimage:/tmp/app.AppImage:ro" \
            -v "$PWD/pkg/depends.txt:/tmp/depends.txt:ro" \
            -v "$PWD/scripts:/tmp/scripts:ro" \
            ubuntu:24.04 bash -euo pipefail /tmp/scripts/ubuntu-appimage-smoke.sh || status=$?
          {
            echo "### published AppImage on a clean Ubuntu 24.04"
            echo
            echo "- asset: \`${{ steps.download.outputs.asset }}\` from \`${{ steps.download.outputs.tag }}\`"
            echo "- sha256: \`${{ steps.download.outputs.digest }}\`"
            echo "- size: ${{ steps.download.outputs.bytes }} bytes"
            echo "- runtime: \`--appimage-extract-and-run\`, because a container has no FUSE mount"
            if [ "$status" -eq 0 ]; then
              echo "- verdict: extracted, and its window loaded"
            else
              echo "- verdict: failed, see the container log above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The file a Linux copy reads has a name the Windows job's latest.yml never
  # has: on Linux x64 electron-updater asks GitHub for `latest-linux.yml`. A
  # release that carries the `.deb` and the AppImage without that file offers no
  # update at all -- the check answers ERR_UPDATER_CHANNEL_FILE_NOT_FOUND, which
  # is what a 1.0.52 copy installed on Ubuntu reported while both packages sat on
  # the release page.
  #
  # The channel is written from the published files, not from this run's build:
  # timestamps travel inside a `.deb` and an AppImage, so a rebuild of the same
  # tree has different bytes and a channel written from it would describe files
  # nobody can download. What it declares -- name, size and sha512 -- is then what
  # a client verifies before installing.
  publish-linux-channel:
    name: Publish the Linux update channel
    # The only job here that writes to a release: it asks for that permission and
    # nothing else, and only on a manual dispatch, so a push to the port branch
    # cannot rewrite an asset people are downloading.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.publish.outputs.skipped }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same step the tag runs: `scripts/publish-linux-channel.cjs` downloads
      # the packages this version publishes, writes the channel with what they
      # weigh and hash, checks it and attaches it. A version that has not been cut
      # writes `skipped=yes` and its own row in the summary, which is why the job
      # below waits on that output rather than on a step of its own.
      - name: Write and attach the Linux update channel
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-linux-channel.cjs pkg

  # What somebody on a fresh Ubuntu asks is whether the app offers them anything,
  # and only the updater answers that. This job installs nothing and boots
  # nothing: it builds the updater the `.deb` ships -- electron-updater's
  # DebUpdater, which is what `resources/package-type` selects -- and requires it
  # to read the published channel and name both packages. A file that is missing,
  # stale, or names a package the release does not have fails here with the error
  # the window shows.
  find-linux-channel:
    name: Find the published Linux channel with the app's updater
    needs: publish-linux-channel
    if: github.event_name == 'workflow_dispatch' && needs.publish-linux-channel.outputs.skipped == 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache: npm`: the only thing this job installs is the one library the
      # probe imports, and restoring the app's cache to install sixteen packages
      # costs more than the install.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The probe imports `electron-updater` and `builder-util-runtime` and nothing
      # else from the tree, so the whole dependency tree -- 800 MB of it -- has no
      # business in this job either. The version comes from the lockfile, which is
      # what electron-builder packed into the `.deb`, so the probe asks with the
      # same client the package ships, exactly as the tag's channel job does.
      - name: Install the updater the .deb ships
        shell: bash
        run: |
          set -euo pipefail
          updater=$(node -p "require('./package-lock.json').packages['node_modules/electron-updater'].version")
          npm install --prefix probe-deps --no-save --no-package-lock --no-audit --no-fund "electron-updater@$updater"
          node -p "'installed electron-updater ' + require('./probe-deps/node_modules/electron-updater/package.json').version + ', the lockfile says $updater'"

      # Every asset on a release carries a digest GitHub records. Reading the
      # channel through the same check the `.deb` and the AppImage jobs use keeps
      # the probe from passing on a file the download URL does not serve.
      - name: Download the published channel file
        id: channel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/fetch-release-asset.mjs "v$version" latest-linux.yml channel

      # NODE_PATH is how the probe finds the package installed beside it: the
      # workspace itself has no `node_modules` in this job.
      - name: Read the feed the way an installed copy does
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/probe-deps/node_modules
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ ! -s channel/latest-linux.yml ]; then
            echo "::error::the release served no latest-linux.yml"
            exit 1
          fi
          node scripts/probe-linux-updater.cjs --version "$version"
          {
            echo "### Linux updater on v$version"
            echo
            echo "- channel: \`latest-linux.yml\`, downloaded from the release"
            echo "- verdict: DebUpdater found both packages in it"
          } >> "$GITHUB_STEP_SUMMARY"

      # The step above proves this cut finds its own feed; this one proves a
      # machine that has not updated yet is offered it, which is the question that
      # used to be answered by hand. The copy simulated is the last published
      # stable release before this one, read from the page: a version written here
      # would go stale, and failing because the release aged out says nothing
      # about the app. With no earlier release the step reports the fallback and
      # carries on -- the first stable cut has no installed copy behind it.
      - name: Ask the feed the way the previous release's copy does
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/probe-deps/node_modules
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          previous=$(node scripts/previous-release.cjs --current "$version")
          if [ -z "$previous" ]; then
            echo "::notice::v$version is the first stable release; there is no older copy to simulate"
            {
              echo "### A copy of the previous release"
              echo
              echo "- no earlier stable release on the page, so no older copy was asked"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/probe-linux-updater.cjs --version "$version" --installed "$previous"
          {
            echo "### A copy at $previous"
            echo
            echo "- asked the feed as an installed $previous and the updater offered v$version"
            echo "- the same two packages and sha512 prefixes as the updater on this cut"
          } >> "$GITHUB_STEP_SUMMARY"
