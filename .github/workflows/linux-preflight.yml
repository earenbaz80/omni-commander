name: Linux portability preflight

# Manual or Linux-port branch only: it builds and packages, which is too slow for
# every push. The real server's POSIX adapter is covered on master and in pull
# requests by `linux-integration.yml` instead.
on:
  workflow_dispatch:
  push:
    branches:
      - linux-port

permissions:
  contents: read

jobs:
  preflight:
    name: Static checks and build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation links
        run: npm run check:links

      - name: Lint
        run: npm run lint

      - name: Lint renderer
        run: npm run lint:eslint

      - name: Type check
        run: npm run typecheck:strict

      - name: Build renderer
        run: npm run build

      - name: Build Electron bundles
        run: npm run build:electron

      # These are test artifacts, not a release. The workflow does not run on
      # tags and electron-builder is told never to publish, so the packages are
      # only available from the run's artifacts. A Linux tester can still
      # download and install them to exercise the port.
      - name: Package the Linux AppImage and the .deb
        run: npx electron-builder --linux AppImage deb --publish never

      # The .deb is not just a renamed tarball: read its control fields and tie
      # them to package.json, so a package built from the wrong tree fails here
      # instead of on the machine of whoever installs it.
      - name: Check the AppImage and the .deb were produced
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::electron-builder produced no AppImage"
            exit 1
          fi
          if [ -z "$deb" ]; then
            echo "::error::electron-builder produced no .deb"
            exit 1
          fi
          expected=$(node -p "require('./package.json').version")
          actual=$(dpkg-deb -f "$deb" Version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::the .deb reports version $actual, package.json says $expected"
            exit 1
          fi
          dpkg-deb -f "$deb" Package Version Maintainer
          file "$appimage" "$deb"
          ls -lh "$appimage" "$deb"

      - name: Upload the AppImage test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicommander-pro-linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload the .deb test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicommander-pro-linux-deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 7

      # The artifacts are already uploaded, so a build that breaks here still
      # reaches whoever has to look at it. What this proves is different from
      # the integration suite: that the packaged app starts on its own, serves
      # its own renderer and lists a mount, not just that the server module
      # answers when a test harness boots it.
      - name: Smoke the packaged AppImage under Xvfb
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          # The step summary is the only view of this verdict left once the log
          # is gone, and the script swallows its own write errors so a passing
          # app can still leave nobody able to read the rows it found. Failing
          # the step when the file stayed empty keeps "no summary" from looking
          # like success.
          status=0
          xvfb-run -a node scripts/linux-app-smoke.mjs "$appimage" || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux AppImage smoke' "$GITHUB_STEP_SUMMARY"; then
            echo "the verdict is in the run's step summary"
          else
            echo "::error::the smoke left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The smoke above proves the window boots and lists a mount. These three
      # cases ask whether the package can be used at all -- a folder opened, a
      # file copied between the panels, a file deleted for good -- because the
      # listing never touches the keyboard engine, the transfer queue or the
      # server's delete.
      - name: Run the packaged AppImage's interaction cases under Xvfb
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          status=0
          xvfb-run -a node scripts/linux-app-e2e.mjs "$appimage" || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux AppImage e2e' "$GITHUB_STEP_SUMMARY"; then
            echo "the cases are in the run's step summary"
          else
            echo "::error::the interaction cases left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The Windows suite and e2e still assume Windows drives, shells and
      # shortcuts, so they are not run here. The real server's POSIX adapter is
      # covered on master and in pull requests by `linux-integration.yml`.
