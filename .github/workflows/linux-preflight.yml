name: Linux portability preflight

# Manual or Linux-port branch only: it builds and packages, which is too slow for
# every push. The real server's POSIX adapter is covered on master and in pull
# requests by `linux-integration.yml` instead.
on:
  workflow_dispatch:
  push:
    branches:
      - linux-port

permissions:
  contents: read

jobs:
  preflight:
    name: Static checks and build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation links
        run: npm run check:links

      - name: Lint
        run: npm run lint

      - name: Lint renderer
        run: npm run lint:eslint

      - name: Type check
        run: npm run typecheck:strict

      - name: Build renderer
        run: npm run build

      - name: Build Electron bundles
        run: npm run build:electron

      # These are test artifacts, not a release. The workflow does not run on
      # tags and electron-builder is told never to publish, so the packages are
      # only available from the run's artifacts. A Linux tester can still
      # download and install them to exercise the port.
      - name: Package the Linux AppImage and the .deb
        run: npx electron-builder --linux AppImage deb --publish never

      # The .deb is not just a renamed tarball: read its control fields and tie
      # them to package.json, so a package built from the wrong tree fails here
      # instead of on the machine of whoever installs it.
      - name: Check the AppImage and the .deb were produced
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$appimage" ]; then
            echo "::error::electron-builder produced no AppImage"
            exit 1
          fi
          if [ -z "$deb" ]; then
            echo "::error::electron-builder produced no .deb"
            exit 1
          fi
          expected=$(node -p "require('./package.json').version")
          actual=$(dpkg-deb -f "$deb" Version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::the .deb reports version $actual, package.json says $expected"
            exit 1
          fi
          dpkg-deb -f "$deb" Package Version Maintainer
          file "$appimage" "$deb"
          ls -lh "$appimage" "$deb"

      - name: Upload the AppImage test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicommander-pro-linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload the .deb test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicommander-pro-linux-deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 7

      # The artifacts are already uploaded, so a build that breaks here still
      # reaches whoever has to look at it. What this proves is different from
      # the integration suite: that the packaged app starts on its own, serves
      # its own renderer and lists a mount, not just that the server module
      # answers when a test harness boots it.
      - name: Smoke the packaged AppImage under Xvfb
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          # The step summary is the only view of this verdict left once the log
          # is gone, and the script swallows its own write errors so a passing
          # app can still leave nobody able to read the rows it found. Failing
          # the step when the file stayed empty keeps "no summary" from looking
          # like success.
          status=0
          xvfb-run -a node scripts/linux-app-smoke.mjs "$appimage" || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux smoke (AppImage)' "$GITHUB_STEP_SUMMARY"; then
            echo "the verdict is in the run's step summary"
          else
            echo "::error::the smoke left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The smoke above proves the window boots and lists a mount. These four
      # cases ask whether the package can be used at all -- a folder opened, a
      # file copied between the panels, one file deleted for good and another
      # sent to the trash and restored -- because the listing never touches the
      # keyboard engine, the transfer queue or the server's delete.
      - name: Run the packaged AppImage's interaction cases under Xvfb
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          chmod +x "$appimage"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          status=0
          xvfb-run -a node scripts/linux-app-e2e.mjs "$appimage" || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux AppImage e2e' "$GITHUB_STEP_SUMMARY"; then
            echo "the cases are in the run's step summary"
          else
            echo "::error::the interaction cases left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # A .deb is a different package from the AppImage: the program lands under
      # /opt, its dependencies are declared, and a .desktop file points at it.
      # Building one proves neither that apt can install it nor that the copy it
      # leaves behind starts, which is exactly what a user does with the file
      # this run publishes.
      - name: Install the .deb and smoke the copy under /opt
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)
          package=$(dpkg-deb -f "$deb" Package)
          executable=$(node -p "require('./package.json').build.linux.executableName")

          sudo apt-get update
          # By path, so apt installs the package this run built instead of a
          # release that happens to be published.
          sudo apt-get install -y --no-install-recommends "./$deb"

          # Where the package says it put the program, rather than a layout this
          # step assumes: a change there has to break here instead of hide.
          binary=$(dpkg -L "$package" | grep -E "^/opt/.*/${executable}$" | head -n 1 || true)
          if [ -z "$binary" ]; then
            files=$(dpkg -L "$package" | head -c 600 | tr '\n' ' ')
            echo "::error::the .deb installed no program at /opt/*/$executable; it installed: $files"
            exit 1
          fi
          echo "installed at $binary"

          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          status=0
          xvfb-run -a node scripts/linux-app-smoke.mjs "$binary" 'installed .deb' || status=$?
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ] && grep -q 'Linux smoke (installed .deb)' "$GITHUB_STEP_SUMMARY"; then
            echo "the verdict is in the run's step summary"
          else
            echo "::error::the installed copy left no verdict in the step summary"
            status=1
          fi
          exit "$status"

      # The Windows suite and e2e still assume Windows drives, shells and
      # shortcuts, so they are not run here. The real server's POSIX adapter is
      # covered on master and in pull requests by `linux-integration.yml`.

  # Every check above runs on an image that already carries what Electron links
  # against, so a `.deb` missing a dependency still installs and starts there.
  # This job repeats the install in a bare ubuntu image, where only the package's
  # own `Depends` can supply what the program needs.
  clean-ubuntu-install:
    name: Install the .deb on a clean Ubuntu 24.04
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the .deb this run built
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: omnicommander-pro-linux-deb
          path: pkg

      - name: Install and boot it inside ubuntu:24.04
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find pkg -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "::error::the run produced no .deb to install"
            exit 1
          fi
          status=0
          docker run --rm \
            -v "$PWD/$deb:/tmp/package.deb:ro" \
            -v "$PWD/scripts/ubuntu-install-smoke.sh:/tmp/ubuntu-install-smoke.sh:ro" \
            ubuntu:24.04 bash -euo pipefail /tmp/ubuntu-install-smoke.sh || status=$?
          if [ "$status" -eq 0 ]; then
            echo "### .deb on a clean Ubuntu 24.04: installed and booted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### .deb on a clean Ubuntu 24.04: failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
