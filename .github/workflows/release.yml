name: CI and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  # The matrix has to install a concrete version, and repeating the floor by hand
  # is exactly how it drifts from the declaration it is supposed to test.
  engines:
    name: Node floor from package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      floor: ${{ steps.read.outputs.floor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `node` ships with the hosted runner and this only reads a string, so the
      # job needs neither setup-node nor the dependency tree.
      - name: Read engines.node
        id: read
        run: echo "floor=$(node scripts/engines-floor.cjs)" >> "$GITHUB_OUTPUT"

  verify:
    name: Typecheck, lint, format and tests (Node ${{ matrix.node-version }})
    needs: engines
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Both legs report even when one fails, so a red floor is not hidden by a
      # green latest.
      fail-fast: false
      matrix:
        # The floor read from engines.node, plus the newest 22.x, which is what
        # the release job runs on ('22' means the latest 22.x).
        node-version: ['${{ needs.engines.outputs.floor }}', '22']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # npm only warns when the runner's Node misses engines.node, so the flag
      # makes that mismatch a failed install (it also holds dependencies' claims).
      - name: Install dependencies
        run: npm ci --engine-strict

      # A local `npm run electron:build` could not finish while `npm run dev` was
      # up: the dev server watched release/, the folder electron-builder renames
      # into place, and its open handles made that rename fail with EPERM. The
      # rule that prevents it is easy to drop without noticing, so losing it
      # fails here: a green run must not promise a build that cannot finish.
      - name: Dev server and packaging output
        run: node scripts/dev-watcher-guard.cjs

      # .gitattributes checks text files out with LF, so this gate compares the
      # same bytes on the Windows runner as it does locally.
      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run lint

      # tsconfig.strict.json adds the flags the app-wide config leaves off
      # (strict, unused locals and parameters, fallthrough, override). It was a
      # script nobody ran and had drifted to eleven errors; a person cannot keep
      # it at zero, so it runs on every push.
      - name: Strict typecheck
        run: npm run typecheck:strict

      - name: Lint
        run: npm run lint:eslint

      # The default worker count is flaky on the CI runner; the suite is stable
      # with an explicit cap.
      - name: Unit tests
        run: npm test -- --maxWorkers=2

  build:
    name: Build and publish
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # '22' means the latest 22.x, which must keep satisfying engines.node
          # in package.json (the floor comes from jsdom, not from our own code).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Build Electron app
        run: npm run build:electron

      # Publishing here used to open a *draft* for the tag. Drafts are invisible
      # to the "release by tag" lookup the upload step uses, so that step found
      # no release, created a second one for the same tag, and every installer
      # stayed behind in the draft. electron-builder now only writes files, and
      # one step publishes them all into a single release.
      - name: Package Windows artifacts
        run: npx electron-builder --win --publish never

      # The tag is not trusted for the file names: the package version is what
      # electron-builder names the artifacts after, so both must agree.
      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the package version
        shell: bash
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # GitHub rewrites the spaces in an uploaded asset name to dots, while
      # latest.yml — written by electron-builder — points at hyphenated names.
      # 1.0.6 published an installer no updater would find, so the files are
      # renamed on disk before anything is uploaded and the two agree.
      - name: Name the artifacts the way latest.yml does
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          cd release
          Rename-Item "OmniCommander Pro $version.exe" "OmniCommander-Pro-$version.exe"
          Rename-Item "OmniCommander Pro Setup $version.exe" "OmniCommander-Pro-Setup-$version.exe"
          Rename-Item "OmniCommander Pro Setup $version.exe.blockmap" "OmniCommander-Pro-Setup-$version.exe.blockmap"

      - name: Compress release artifacts
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          cd release
          Compress-Archive -Path "OmniCommander-Pro-$version.exe" -DestinationPath "OmniCommander-Pro-$version.zip" -Force
          Compress-Archive -Path "OmniCommander-Pro-Setup-$version.exe" -DestinationPath "OmniCommander-Pro-Setup-$version.zip" -Force
        shell: pwsh

      # A release whose asset names disagree with latest.yml cannot be updated
      # to: the updater downloads the path named in the metadata. Failing here
      # keeps a release no client could install from being published at all.
      - name: Check the artifacts match latest.yml
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $declared = Select-String -Path release/latest.yml -Pattern '^path:\s*(.+)$' | Select-Object -First 1
          if (-not $declared) { throw "release/latest.yml declares no path" }
          $target = $declared.Matches[0].Groups[1].Value.Trim()

          $expected = @(
            "OmniCommander-Pro-$version.exe",
            "OmniCommander-Pro-Setup-$version.exe",
            "OmniCommander-Pro-Setup-$version.exe.blockmap",
            "OmniCommander-Pro-$version.zip",
            "OmniCommander-Pro-Setup-$version.zip",
            "latest.yml"
          )
          foreach ($name in $expected) {
            if ($name -match '\s') { throw "Artifact '$name' has a space, which GitHub rewrites on upload" }
            if (-not (Test-Path (Join-Path release $name) -PathType Leaf)) { throw "Missing artifact '$name'" }
          }
          if ($expected -notcontains $target) {
            throw "latest.yml points at '$target', which is not among the artifacts: $($expected -join ', ')"
          }

          # The size latest.yml advertises is the one clients will download.
          $size = Select-String -Path release/latest.yml -Pattern '^\s*size:\s*(\d+)' | Select-Object -First 1
          if ($size) {
            $wanted = [int64]$size.Matches[0].Groups[1].Value
            $actual = (Get-Item (Join-Path release $target)).Length
            if ($wanted -ne $actual) { throw "latest.yml declares $wanted bytes for '$target', the file has $actual" }
          }
          Write-Host "latest.yml names '$target' and the release publishes it."

      # `latest.yml` and the block map are what the app's updater reads, so they
      # are published next to the binaries they describe.
      # A version with a suffix (`1.0.19-beta.1`) is a test build and is published
      # as a GitHub prerelease, which is the flag that keeps it out of the stable
      # feed: the updater asks `/releases/latest` unless the copy opted into the
      # beta channel. Everything else is marked Latest as before.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
