name: CI and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

# One run per branch or tag. A pull request that receives a new push cancels its
# previous run, which is the case that used to queue minutes of work nobody would
# read; a tag build is never cancelled, because it uploads a release half way
# through and there is no safe point to stop at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action here is pinned to a release that runs on Node 24. The runners
# still force Node 20 actions onto 24 and warn on each run, but the shim is
# temporary: when it goes, an old pin stops working instead of getting slower.
# Dependabot moves these SHAs and the version comments together.
jobs:
  # The matrix has to install a concrete version, and repeating the floor by hand
  # is exactly how it drifts from the declaration it is supposed to test.
  engines:
    name: Node floor from package.json
    # The product is Windows-only, so its CI is too: no job runs on a Linux image.
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      floor: ${{ steps.read.outputs.floor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `node` ships with the hosted runner and this only reads a string, so the
      # job needs neither setup-node nor the dependency tree. The shell is named
      # because Windows defaults to pwsh, where `$GITHUB_OUTPUT` is not expanded
      # and would be written to a file with that literal name.
      - name: Read engines.node
        id: read
        shell: bash
        run: echo "floor=$(node scripts/engines-floor.cjs)" >> "$GITHUB_OUTPUT"

  verify:
    name: Typecheck, lint, format and tests (Node ${{ matrix.node-version }})
    needs: engines
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Both legs report even when one fails, so a red floor is not hidden by a
      # green latest.
      fail-fast: false
      matrix:
        # The floor read from engines.node; the newest 22.x, which is what the
        # release job runs on ('22' means the latest 22.x); and the newest 24.x.
        # Without the 24 leg no run installed a major above 22, so engines.node
        # could keep promising ^24.15.0 while every push tested only the line it
        # already shipped, and a break on 24 would first show up in a user's
        # terminal. The 26.x the range also allows is not in the matrix yet.
        node-version: ['${{ needs.engines.outputs.floor }}', '22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # npm only warns when the runner's Node misses engines.node, so the flag
      # makes that mismatch a failed install (it also holds dependencies' claims).
      # setup-node already restores the npm cache, which is the whole of what
      # caching can do here: npm ci lands around 50s, 17% of the job, and caching
      # node_modules instead would move a ~800MB tree against the 142MB cache
      # that already costs 12s to restore. --prefer-offline, --no-audit and
      # --no-fund were measured on the runner too and moved nothing (46s against
      # a 51s median), so they are not here to make it look faster.
      - name: Install dependencies
        run: npm ci --engine-strict

      # Production dependencies must be clean: everything here ships inside the
      # installer, so an advisory in them is a real one. The full audit runs too
      # and goes red on high or critical, but the four lows it reports today
      # cannot be patched here: they are one chain (deepmerge under
      # @rollup/plugin-node-resolve, which workbox-build uses, which
      # vite-plugin-pwa uses), deepmerge 4.3.1 is the newest published version and
      # the advisory covers everything up to it, and npm's only offered fix is a
      # downgrade of vite-plugin-pwa to 0.2.1 that would break the PWA. Gating at
      # high keeps a real advisory red instead of failing every push on one that
      # has no fix and only an annotation to show for it.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      # A local `npm run electron:build` could not finish while `npm run dev` was
      # up: the dev server watched release/, the folder electron-builder renames
      # into place, and its open handles made that rename fail with EPERM. The
      # rule that prevents it is easy to drop without noticing, so losing it
      # fails here: a green run must not promise a build that cannot finish.
      - name: Dev server and packaging output
        run: node scripts/dev-watcher-guard.cjs

      # .gitattributes checks text files out with LF, so this gate compares the
      # same bytes on the Windows runner as it does locally.
      - name: Formatting
        run: npm run format:check

      # The audits moved into docs/audits/ and every link that pointed at the
      # repository root had to be rewritten; a rename will do that again, and
      # nothing caught it but a person rereading the file. The target has to
      # exist and be in the index, so a link to a file that only exists on one
      # machine, or one written with the wrong case, fails here instead of
      # 404ing for whoever reads it next.
      - name: Documentation links
        run: npm run check:links

      - name: Typecheck
        run: npm run lint

      # tsconfig.strict.json adds the flags the app-wide config leaves off
      # (strict, unused locals and parameters, fallthrough, override). It was a
      # script nobody ran and had drifted to eleven errors; a person cannot keep
      # it at zero, so it runs on every push.
      - name: Strict typecheck
        run: npm run typecheck:strict

      - name: Lint
        run: npm run lint:eslint

      # Excluding the workspace from the on-access scan was tried here and does
      # not pay: this runner opens a file in 0.024ms, against 0.68ms on a
      # developer machine with the scan on, so the exclusion reclaimed 0.024 to
      # 0.018ms and the suite did not move. It stays a local-machine remedy (see
      # the README); adding it back here only adds a step that can fail with a
      # provider error, which it did on one of the two legs.

      # The default worker count is flaky on the CI runner; the suite is stable
      # with an explicit cap.
      - name: Unit tests
        if: matrix.node-version != '22'
        run: npm test -- --maxWorkers=2

      # One leg measures instead of repeating the plain run, so the gate costs no
      # extra time: the same suite, against the thresholds in vite.config.ts. A
      # drop in coverage turns this leg red, which is the point of having them.
      - name: Unit tests with coverage
        if: matrix.node-version == '22'
        run: npm run test:coverage -- --maxWorkers=2

      # A red threshold says the number moved; the report says where. Uploading it
      # even when the run failed, which is exactly when somebody wants to look.
      - name: Keep the coverage report
        if: always() && matrix.node-version == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # The e2e specs lived outside the gate: eleven files nobody ran unless they
  # remembered, so a push could be green while the app was broken in a browser.
  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --engine-strict

      # --with-deps installs system libraries and is a Linux-only flag; on the
      # Windows runner the browser build is the whole of the requirement.
      - name: Install Chromium
        run: npx playwright install chromium

      # The suite's own window, not the job's: a retry or a slow runner only
      # shows up when the spec run is measured on its own.
      - name: Note when the suite started
        id: e2e-start
        shell: bash
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +'%Y-%m-%d %H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: End-to-end tests
        # The count in the summary has to say what actually ran, retries and
        # skips included, so the JSON reporter records the run beside the list
        # output people read in the log.
        run: npm run test:e2e -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json

      # The run list shows when the job ended, not when the suite did: the two
      # differ by the runner's own bookkeeping and, when it matters, by a retry.
      # A job name cannot carry a clock (expressions are evaluated when the job
      # starts), so the suite's own window goes in the summary, which stays with
      # the run and is written even when the specs failed -- the case somebody
      # looks at. The counts and the link are there for the same reason: the
      # summary should answer "what ran, and how long" without opening the log.
      # A summary that cannot count the tests is a broken report, not a run with
      # none, and a summary that cannot time the suite has lost its start
      # marker: either way the step fails rather than printing "unknown" under a
      # green job, because a row nobody can trust is worse than no row at all.
      - name: Note when the suite finished
        if: always()
        shell: bash
        run: |
          finished=$(date +%s)
          started='${{ steps.e2e-start.outputs.epoch }}'
          timing_problem=''
          if [ -n "$started" ]; then
            elapsed=$(( finished - started ))
            duration=$(printf '%dm %02ds' $(( elapsed / 60 )) $(( elapsed % 60 )))
          else
            duration='unknown: the run never reached the start marker'
            timing_problem='the suite start marker was never set'
          fi
          report='${{ runner.temp }}/playwright-report.json'
          tests=''
          flaky=''
          problem=''
          if [ ! -f "$report" ]; then
            problem='the JSON report was never written to the runner temp directory'
          else
            if output=$(node -e '
              const fs = require("fs");
              let json;
              try {
                json = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              } catch (error) {
                // Only the message: the stack and its location header are noise
                // once the summary row already says which file is at fault.
                console.error(error.message);
                process.exit(1);
              }
              const { stats } = json;
              if (!stats) {
                console.error("the report has no stats section");
                process.exit(1);
              }
              const out = [];
              if (stats.expected) out.push(`${stats.expected} passed`);
              if (stats.flaky) out.push(`${stats.flaky} flaky`);
              if (stats.unexpected) out.push(`${stats.unexpected} failed`);
              if (stats.skipped) out.push(`${stats.skipped} skipped`);
              // A retried pass keeps the job green, so the titles travel with
              // the counts: they are what turns "1 flaky" into a name.
              const retried = [];
              (function walk(suites) {
                for (const suite of suites || []) {
                  for (const spec of suite.specs || []) {
                    for (const test of spec.tests || []) {
                      if (test.status === "flaky") retried.push(spec.title);
                    }
                  }
                  walk(suite.suites);
                }
              })(json.suites);
              process.stdout.write([out.join(", "), retried.join("; ")].join("\n"));
            ' "$report" 2>&1); then
              # Two lines: the counts, then the titles of the cases that only
              # passed on the retry, empty when nothing was retried.
              tests=$(printf '%s\n' "$output" | sed -n '1p')
              flaky=$(printf '%s\n' "$output" | sed -n '2p')
            else
              # Node names the fault on one line; a stack would break the table.
              problem="the JSON report could not be read: $(printf '%s' "$output" | head -1)"
            fi
            [ -n "$tests" ] || [ -n "$problem" ] || problem='the JSON report lists no tests'
          fi
          [ -n "$tests" ] || tests="unknown: $problem"
          {
            echo "### End-to-end (Playwright)"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Suite started (UTC) | ${{ steps.e2e-start.outputs.iso }} |"
            echo "| Suite finished (UTC) | $(date -u +'%Y-%m-%d %H:%M:%SZ') |"
            echo "| Duration | ${duration} |"
            echo "| Tests | ${tests} |"
            echo "| Result | ${{ job.status }} |"
            echo "| Run | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A case that failed once and passed on the retry leaves the job green,
          # so the summary names it and the run carries a warning. The step stays
          # green on purpose: a retried case is news, not a blocked push, and the
          # red is kept for a summary that cannot be counted.
          if [ -n "$flaky" ]; then
            {
              echo ""
              echo "Passed on a retry: ${flaky}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::the suite retried and passed: $(printf '%s' "$flaky" | tr -d '\r\n' | sed 's/%/%25/g')"
          fi
          # The summary is already written, so the annotation and the red step
          # land next to the row that explains them. A run can lose its clock
          # and its report at once, so both are reported before exiting.
          failed=''
          if [ -n "$problem" ]; then
            failed=1
            echo "::error::the end-to-end summary could not count the tests: $(printf '%s' "$problem" | tr -d '\r\n' | sed 's/%/%25/g')"
          fi
          if [ -n "$timing_problem" ]; then
            failed=1
            echo "::error::the end-to-end summary could not time the suite: $(printf '%s' "$timing_problem" | tr -d '\r\n' | sed 's/%/%25/g')"
          fi
          [ -z "$failed" ] || exit 1

      # A case that fails once and passes on the retry leaves the job green, so
      # the JSON report is the only place the retry shows up: it carries the
      # counts the summary step reads, "1 flaky" among them. It is written to the
      # runner's temp directory, which an artifact cannot be uploaded from, so it
      # is copied into the workspace first. Kept on every run, red or green,
      # because a green run is exactly where a flake hides.
      - name: Keep the JSON report of the run
        if: always()
        shell: bash
        run: |
          mkdir -p e2e-report
          report='${{ runner.temp }}/playwright-report.json'
          if [ -f "$report" ]; then
            cp "$report" e2e-report/playwright-report.json
          else
            # The summary step already failed the job over this, so the upload
            # has nothing to keep and says so instead of inventing a report.
            echo 'the run left no JSON report'
          fi

      - name: Upload the JSON report of the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7
          if-no-files-found: ignore

      # A failing spec says which one broke; the trace says what the page was
      # doing, and only exists for the run that failed.
      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Nothing built the app or the docs before a tag: the publishing job is the
  # only one that runs a build, so a config change that broke it stayed green on
  # every push and went red on the release, in front of whoever cut it. These
  # builds now run on every push, next to the end-to-end specs rather than after
  # them, so the gate costs the run no extra wall clock.
  builds:
    name: Build app and Storybook
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Build the app
        run: npm run build

      # The docs were broken in a way no check could see: the PWA plugin in the
      # app config tried to precache Storybook's 3.3 MB manager runtime and the
      # build died inside workbox. Building it here keeps that from coming back.
      - name: Build Storybook
        run: npm run build-storybook

  build:
    name: Build and publish
    needs: [verify, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # '22' means the latest 22.x, which must keep satisfying engines.node
          # in package.json (the floor comes from jsdom, not from our own code).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Build Electron app
        run: npm run build:electron

      # Publishing here used to open a *draft* for the tag. Drafts are invisible
      # to the "release by tag" lookup the upload step uses, so that step found
      # no release, created a second one for the same tag, and every installer
      # stayed behind in the draft. electron-builder now only writes files, and
      # one step publishes them all into a single release.
      - name: Package Windows artifacts
        run: npx electron-builder --win --publish never

      # The tag is not trusted for the file names: the package version is what
      # electron-builder names the artifacts after, so both must agree.
      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the package version
        shell: bash
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      # GitHub rewrites the spaces in an uploaded asset name to dots, while
      # latest.yml — written by electron-builder — points at hyphenated names.
      # 1.0.6 published an installer no updater would find, so the files are
      # renamed on disk before anything is uploaded and the two agree.
      - name: Name the artifacts the way latest.yml does
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          cd release
          Rename-Item "OmniCommander Pro $version.exe" "OmniCommander-Pro-$version.exe"
          Rename-Item "OmniCommander Pro Setup $version.exe" "OmniCommander-Pro-Setup-$version.exe"
          Rename-Item "OmniCommander Pro Setup $version.exe.blockmap" "OmniCommander-Pro-Setup-$version.exe.blockmap"

      - name: Compress release artifacts
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          cd release
          Compress-Archive -Path "OmniCommander-Pro-$version.exe" -DestinationPath "OmniCommander-Pro-$version.zip" -Force
          Compress-Archive -Path "OmniCommander-Pro-Setup-$version.exe" -DestinationPath "OmniCommander-Pro-Setup-$version.zip" -Force
        shell: pwsh

      # A copy with the beta switch on asks for `<channel>.yml` first — `beta.yml`
      # for 1.0.22-beta.1 — and only falls back to `latest.yml` when that file is
      # missing, which is a 404 in the log and a fallback nobody wrote down. The
      # GitHub provider makes electron-builder write a single update file, so the
      # copy is made here and the beta is found on the first request instead of
      # the second.
      - name: Copy the channel file a beta asks for
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dash = $version.IndexOf('-')
          if ($dash -lt 0) {
            Write-Host "Stable $version, nothing to copy."
            exit 0
          }
          $channel = (($version.Substring($dash + 1)) -split '\.')[0]
          Copy-Item release/latest.yml "release/$channel.yml"
          Write-Host "release/$channel.yml copied from latest.yml for $version."

      # A release whose asset names disagree with latest.yml cannot be updated
      # to: the updater downloads the path named in the metadata. Failing here
      # keeps a release no client could install from being published at all.
      - name: Check the artifacts match latest.yml
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $declared = Select-String -Path release/latest.yml -Pattern '^path:\s*(.+)$' | Select-Object -First 1
          if (-not $declared) { throw "release/latest.yml declares no path" }
          $target = $declared.Matches[0].Groups[1].Value.Trim()

          # A beta also carries `<channel>.yml`: the file the updater asks for by
          # name before falling back to latest.yml.
          $dash = $version.IndexOf('-')
          $channelFile = if ($dash -ge 0) { (($version.Substring($dash + 1)) -split '\.')[0] + '.yml' } else { $null }

          $expected = @(
            "OmniCommander-Pro-$version.exe",
            "OmniCommander-Pro-Setup-$version.exe",
            "OmniCommander-Pro-Setup-$version.exe.blockmap",
            "OmniCommander-Pro-$version.zip",
            "OmniCommander-Pro-Setup-$version.zip",
            "latest.yml"
          )
          if ($channelFile) { $expected += $channelFile }
          foreach ($name in $expected) {
            if ($name -match '\s') { throw "Artifact '$name' has a space, which GitHub rewrites on upload" }
            if (-not (Test-Path (Join-Path release $name) -PathType Leaf)) { throw "Missing artifact '$name'" }
          }
          if ($expected -notcontains $target) {
            throw "latest.yml points at '$target', which is not among the artifacts: $($expected -join ', ')"
          }

          # The size latest.yml advertises is the one clients will download.
          $size = Select-String -Path release/latest.yml -Pattern '^\s*size:\s*(\d+)' | Select-Object -First 1
          if ($size) {
            $wanted = [int64]$size.Matches[0].Groups[1].Value
            $actual = (Get-Item (Join-Path release $target)).Length
            if ($wanted -ne $actual) { throw "latest.yml declares $wanted bytes for '$target', the file has $actual" }
          }
          # The channel file is a copy, so it has to name the same installer.
          if ($channelFile) {
            $channelPath = Select-String -Path (Join-Path release $channelFile) -Pattern '^path:\s*(.+)$' | Select-Object -First 1
            if (-not $channelPath) { throw "$channelFile declares no path" }
            if ($channelPath.Matches[0].Groups[1].Value.Trim() -ne $target) {
              throw "$channelFile names a different artifact than latest.yml"
            }
          }
          Write-Host "latest.yml names '$target' and the release publishes it."

      # `latest.yml` and the block map are what the app's updater reads, so they
      # are published next to the binaries they describe.
      # A version with a suffix (`1.0.19-beta.1`) is a test build and is published
      # as a GitHub prerelease, which is the flag that keeps it out of the stable
      # feed: the updater asks `/releases/latest` unless the copy opted into the
      # beta channel. Everything else is marked Latest as before.
      # electron-builder leaves this dump beside the update files. It describes
      # the build, not an update, and publishing every `.yml` put it in the
      # release where only `latest.yml` and the channel file belong.
      - name: Drop the builder's debug dump
        shell: pwsh
        run: Remove-Item release/builder-debug.yml -ErrorAction SilentlyContinue

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          # `*.yml` rather than `latest.yml`: a beta publishes its channel file
          # beside it, and that is the one its own copies read first.
          files: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
