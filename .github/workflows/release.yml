name: Release Electron App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compress release artifacts
        run: |
          cd release
          Compress-Archive -Path "OmniCommander Pro ${{ github.ref_name }}.exe" -DestinationPath "OmniCommander Pro ${{ github.ref_name }}.zip" -Force
          Compress-Archive -Path "OmniCommander Pro Setup ${{ github.ref_name }}.exe" -DestinationPath "OmniCommander Pro Setup ${{ github.ref_name }}.zip" -Force
        shell: pwsh

      - name: Upload compressed artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}